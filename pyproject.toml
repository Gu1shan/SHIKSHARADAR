[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shiksha-radar"
version = "0.1.0"
description = "AI-powered learning gap detection platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "streamlit>=1.62",
    "numpy>=2.5",
    "plotly>=6.9",
    "openpyxl>=3.1",
    "scikit-learn>=1.9",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ai = [
    "sentence-transformers>=6.0",
    "groq>=0.10",
    "google-generativeai>=0.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]