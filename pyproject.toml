[tool.poetry]
name = "shiksha-radar"
version = "0.1.0"
description = "AI-powered learning gap detection platform"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
pandas = ">=2.2"
streamlit = ">=1.62"
numpy = ">=2.5"
plotly = ">=6.0"
openpyxl = ">=3.1"
scikit-learn = ">=1.6"
python-dotenv = ">=1.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"

[tool.poetry.group.ai.dependencies]
sentence-transformers = ">=6.0"
groq = ">=0.10"
google-generativeai = ">=0.8"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

